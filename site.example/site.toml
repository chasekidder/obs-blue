# stream-pilot site configuration (template).
#
# Copy this directory to `site/` (gitignored) and fill every value in. The
# ISO kickstart installs the result as ~/.config/stream-pilot/site.toml for
# user `stream`, where it overrides the image's built-in defaults. Only the
# keys listed here are meant to be site-specific; everything else keeps its
# default. There is deliberately no [obs] section: the obs-websocket password
# is generated on first boot into ~/.config/stream-pilot/secrets.toml.
#
# NOTE: an empty string overrides the built-in default, so a value you leave
# as "" is NOT "use the default" - it is "unset". Fill in every uncommented
# value. The camera and microphone IDs can only be read on the installed
# machine, so they stay commented out (built-in defaults apply) until you
# fill them in after the first boot.
#
# After the first boot, if you change a camera or microphone ID below, apply
# it with:
#   systemctl --user stop obs && stream-pilot seed-obs --reset-scenes && systemctl --user start obs

[facebook]
# Numeric ID of the PERSONAL Facebook profile that starts the live video (the
# "actor" in the producer URL: ...producer/?actor=<this>&...). Open the profile
# and read the number from the profile URL (profile.php?id=<number>) or from
# the producer URL after starting a live video by hand.
actor_id = ""
# Numeric ID of the Facebook Group that is streamed to (the "target_id" in the
# producer URL; also the number in https://www.facebook.com/groups/<id>/).
group_id = ""
# The Group's display name exactly as Facebook shows it (used to confirm the
# right Group is selected).
group_name = ""

[ssn]
# Social Stream Ninja session ID. TREAT AS A SECRET: anyone who knows it can
# talk to the stream's chat API. Find it in the SSN extension / dock URL
# (...?session=<this>).
session_id = ""

[cameras.main]
# V4L2 device node for the main camera. On the installed system run:
#   ls -l /dev/v4l/by-id/ /dev/v4l/by-path/
# Prefer the stable by-id link ending in "-video-index0", e.g.
#   /dev/v4l/by-id/usb-Vendor_Camera_SERIAL-video-index0
# If both cameras are the same model without serial numbers their by-id names
# collide; use the /dev/v4l/by-path/...-video-index0 link instead (it is tied
# to the USB port, so always plug each camera into the same port).
#device = "/dev/v4l/by-id/usb-Vendor_Camera_SERIAL-video-index0"

[cameras.jewelry]
# V4L2 device node for the jewelry (close-up) camera; same rules as above.
#device = "/dev/v4l/by-id/usb-Vendor_Camera2_SERIAL-video-index0"

[audio]
# PulseAudio/PipeWire source name of the microphone. On the installed system:
#   pactl list short sources
# and copy the second column of the input device (not a ".monitor" source).
#mic_device = "alsa_input.usb-Vendor_Device-00.mono-fallback"

# ---- Optional features ------------------------------------------------------
# Each feature below has its own section with an `enabled` switch; all of them
# are off by default, and off means the PC behaves exactly as without it. To
# turn one on, uncomment its section header and `enabled = true` (plus any
# option you want to change), then `systemctl --user restart stream-pilot`:
# switches are only read at startup. `stream-pilot status` lists every feature
# as on or off. `enabled` must be a bare true/false (not "true" in quotes).

#[recording]
# Records the microphone ([audio] mic_device) straight from PipeWire while live,
# independently of OBS: Ogg Opus mono clips in ~/streams/<stream>/audio/, listed
# in audio/manifest.jsonl once finished. Also writes ~/streams/<stream>/stream.json
# (live id, pre-roll / Go Live / confirmed / end times, image version, clock sync)
# and, last, ~/streams/<stream>/DONE.
#enabled = true
# Opus bitrate (mono) and clip length.
#bitrate_kbps = 32
#clip_s = 30
# Estimate of how far Facebook's viewers are behind the room, in seconds.
#fb_delay_s = 15
