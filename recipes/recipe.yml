---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: obs-blue
# description will be included in the image's metadata
description: A dedicated bootc image for running OBS and allowing stream automation.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/kinoite-main
image-version: 44 # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  # dnf runs first so package-shipped files never overwrite our /etc overrides,
  # and editing files/ does not invalidate the package-install layer cache.
  - type: dnf
    repos:
      copr:
        - atim/starship
    install:
      packages:
        - micro
        - starship
        - tailscale
        - obs-studio # RPM instead of Flatpak (no obs-studio-plugin-browser: no CEF)
        - chromium # RPM instead of Flatpak
        - v4l-utils
        - hidapi
        - python3-evdev
        - python3-pillow
        - python3-websockets
        - python3-pip
        - greenboot
        - greenboot-default-health-checks
        - libva-intel-media-driver # already in the base; listed explicitly
        - dejavu-sans-fonts # Stream Deck key renderer font
      exclude:
        # obs-studio pulls this in as a weak dependency; the spec wants no CEF/browser plugin
        - obs-studio-plugin-browser
    remove:
      packages:
        - firefox
        - firefox-langpacks # also remove firefox dependency (not required for all packages, this is a special case)

  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: default-flatpaks
    configurations:
      - notify: false # no first-boot notifications on a kiosk-style stream PC
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # RustDesk has no RPM in the configured repos
          - com.rustdesk.RustDesk

  - type: systemd
    system:
      disabled:
        - flatpak-system-update.timer # no unattended flatpak updates
    user:
      disabled:
        - flatpak-user-update.timer # enabled by user preset in the base; disable too
    # obs.service / chromium.service / stream-pilot.service are enabled in Task 5,
    # once the unit files exist (enabling a missing unit fails the build).

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
