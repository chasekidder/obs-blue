<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Live dashboard (chat simulation fixture)</title></head>
<body>
<!--
  Mimics the 2026 Live Producer dashboard's Comments module (markup recorded on the
  stream PC, 2026-11-24) and replays a chat schedule into it:
    window.__simRun(schedule, opts)  schedule: [{delay_ms, author, text, id, reply_to}]
    opts: {cap: N (keep only the last N articles), rerenderEvery: N (re-render the whole
           list after every N comments), relabelMs: aging interval of the time labels}
    window.__simDone becomes true after the last comment (and a final re-render).
  Facebook-like behaviour reproduced: comments appended at the bottom, replies as their
  own article after a "Replying to" line, emoji rendered as <img alt>, the permalink inside
  the controls list (reply permalinks carry comment_id=<parent>&reply_comment_id=<id>),
  time labels in aria-label that age, and React re-renders that replace every node.
-->
<div id="sidebar"><h1>Live dashboard</h1><div role="button">End live video</div></div>
<div id="module">
  <h1>Comments</h1>
  <div role="button" aria-label="Minimize comments">_</div>
  <div id="list"></div>
  <div role="textbox" contenteditable="true" aria-label="Write a comment…"></div>
</div>
<script>
'use strict';
const GROUP = '1111222233334444', POST = '1111222233335555';
const AGES = ['a few seconds ago', 'a minute ago', '2 minutes ago', '5 minutes ago', 'an hour ago', 'about an hour ago', '3 hours ago'];
const list = document.getElementById('list');
const shown = [];   // [{c, age}] in display order
let opts = { cap: 0, rerenderEvery: 0, relabelMs: 0 };
const EMOJI = /(\p{Extended_Pictographic}(?:\uFE0F|[\u{1F3FB}-\u{1F3FF}]|\u200D\p{Extended_Pictographic})*)/u;

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  for (const k of kids) e.append(k);
  return e;
}

function body(text) {
  const d = el('div', { dir: 'auto' });
  for (const part of text.split(EMOJI)) {
    if (!part) continue;
    if (EMOJI.test(part)) d.append(el('img', { alt: part, src: 'data:,', width: '16', height: '16' }));
    else d.append(document.createTextNode(part));
  }
  return d;
}

function build(entry) {
  const c = entry.c;
  const profile = `/groups/${GROUP}/user/${encodeURIComponent(c.author)}/?__tn__=R`;
  const href = `/groups/${GROUP}/permalink/${POST}/?` +
    (c.reply_to ? `comment_id=${c.reply_to}&reply_comment_id=${c.id}` : `comment_id=${c.id}`) + '&__tn__=R';
  const controls = el('ul', { role: 'list' },
    el('li', {}, el('a', { href }, AGES[entry.age].startsWith('a few') ? 'now' : '1m')),
    el('li', {}, el('div', { role: 'button' }, 'Like'), el('div', { role: 'button', 'aria-label': 'React' })),
    el('li', {}, el('div', { role: 'button' }, c.reply_to ? 'See thread' : 'Reply')),
    el('li', {}, el('div', { role: 'button' }, 'Pin')));
  const art = el('div', { role: 'article', 'aria-label': `Comment by ${c.author} ${AGES[entry.age]}`, tabindex: '-1' },
    el('div', {}, el('a', { 'aria-hidden': 'true', href: profile, role: 'link', tabindex: '-1' }, el('span', {}))),
    el('div', {},
      el('div', {}, el('span', {}, el('a', { href: profile, role: 'link', tabindex: '0' }, el('span', {}, c.author)))),
      body(c.text),
      el('div', { role: 'button', 'aria-label': 'Edit or delete this' }),
      controls));
  if (!c.reply_to) return [art];
  const parent = shown.find((s) => s.c.id === c.reply_to);
  return [
    el('div', {}, 'Replying to ' + (parent ? parent.c.author : 'someone')),
    el('div', { role: 'log' }, parent ? parent.c.text.slice(0, 40) : ''),
    art,
  ];
}

function renderAll() {
  list.replaceChildren(...shown.flatMap(build));
}

function add(c) {
  shown.push({ c, age: 0 });
  list.append(...build(shown[shown.length - 1]));
  if (opts.cap && shown.length > opts.cap) {
    shown.splice(0, shown.length - opts.cap);
    renderAll();
  }
}

window.__simDone = false;
window.__simCount = 0;
window.__simRun = (schedule, o) => {
  opts = Object.assign(opts, o || {});
  if (opts.relabelMs) {
    setInterval(() => {
      for (const s of shown) s.age = Math.min(s.age + 1, AGES.length - 1);
      for (const a of list.querySelectorAll('[role=article]')) {
        const s = shown[[...list.querySelectorAll('[role=article]')].indexOf(a)];
        if (s) a.setAttribute('aria-label', `Comment by ${s.c.author} ${AGES[s.age]}`);
      }
    }, opts.relabelMs);
  }
  let i = 0;
  const next = () => {
    if (i >= schedule.length) {
      renderAll();  // a final React re-render: must add nothing
      setTimeout(() => { window.__simDone = true; }, 300);
      return;
    }
    const s = schedule[i++];
    setTimeout(() => {
      add({ author: s.author, text: s.text, id: s.id, reply_to: s.reply_to || null });
      window.__simCount = i;
      if (opts.rerenderEvery && i % opts.rerenderEvery === 0) renderAll();
      next();
    }, s.delay_ms);
  };
  next();
};
</script>
</body></html>
