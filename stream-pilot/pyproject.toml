[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-pilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
runtime = [
  "simpleobsws==1.4.3",
  "streamdeck==0.10.0",
  "playwright==1.65.0",
  "websockets>=12",
  "Pillow>=10",
]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "Pillow>=10", "websockets>=12"]

[project.scripts]
stream-pilot = "stream_pilot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stream_pilot = ["fb/*.js", "data/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["browser: needs headless Chromium + Playwright (set STREAM_PILOT_BROWSER_TESTS=1)"]
