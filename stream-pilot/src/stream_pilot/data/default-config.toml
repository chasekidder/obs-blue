[facebook]
actor_id = ""
group_id = ""
group_name = ""
producer_url_template = "https://www.facebook.com/live/producer/?actor={actor_id}&entry_point=group&target_id={group_id}"
comments_url_template = "https://www.facebook.com/live/producer/v2/{live_id}/dashboard/?entry_point=group"
# The live's title, typed into the producer's post details ([branding] enabled only).
# {group_name} and {date} (a datetime: {date:%b %-d} gives "Nov 24") are filled in.
live_title_template = "{group_name} Sale – {date:%b %-d}"

[obs]
host = "127.0.0.1"
port = 4455
password = ""

[cdp]
url = "http://127.0.0.1:9222"
user_data_dir = "~/.local/share/stream-pilot/chromium"
chromium_bin = "/usr/bin/chromium-browser"

[ssn]
enabled = true
session_id = ""

[cameras.main]
scene = "Main Camera"
device = "/dev/video0"

[cameras.jewelry]
scene = "Jewlery Camera"
device = "/dev/video2"

[audio]
# PulseAudio/PipeWire source name (`pactl list short sources`).
mic_device = "alsa_input.usb-0c76_USB_PnP_Audio_Device-00.mono-fallback"

[memory]
interval_s = 60
floor_mb = 600
popout_rss_warn_mb = 1500
auto_reload_popout = false

[deck]
long_press_s = 3.0
brightness = 70

[timeouts]
step_s = 30
attempts = 3
preview_s = 180
live_confirm_s = 60
stop_s = 10
fb_end_wait_s = 5
net_retry_s = 1
reconnect_retry_s = 5

[paths]
state_dir = "~/.local/state/stream-pilot"
streams_dir = "~/streams"
failures_dir = "~/.local/state/stream-pilot/failures"

# ---- Optional features (all off by default; see site.example/site.toml) ----

[recording]
# Records [audio] mic_device into <stream folder>/audio/ while live, and writes
# stream.json and DONE into the stream folder.
enabled = false
bitrate_kbps = 32
clip_s = 30
# Estimated delay between the room and what Facebook's viewers see.
fb_delay_s = 15
# Whether Facebook's replay of a live starts with the pre-roll before Go live
# (measured on the stream PC; see docs/superpowers/notes/2026-11-24-hardware-checks.md).
replay_includes_preroll = false

[upload]
# Copies the stream folders, status.json and failure snapshots to another
# machine with rsync over SSH (stream-pilot-upload.timer, about every 60 s).
enabled = false
# user@host:path; with rrsync on the server, path is relative to its directory.
target = ""
# The server's SSH host key, pinned: "ssh-ed25519 AAAA..." (ssh-keyscan -t ed25519 <host>).
host_key = ""
port = 22
# Kilobits per second: the uplink is shared with the stream.
bwlimit_kbps = 200
# rsync --timeout (no data for this long ends the run) and the SSH connect timeout.
timeout_s = 60
connect_timeout_s = 10
# The upload at the end of a stream (before power-off) stops after this long.
final_timeout_s = 30
# Local stream folders are deleted once fully uploaded and older than this.
retention_days = 90

[holding]
# A scene without the microphone on air before Go Live (the pre-roll), switched
# to the camera scene when Facebook confirms the live. mode = "studio": OBS's
# Studio Mode, camera keys change the preview; "banner": the camera picture with
# a text banner.
enabled = false
mode = "studio"
text = "Starting soon"

[branding]
# A text watermark (a placeholder for a logo) in a corner of the camera scenes, an
# outro card for outro_s seconds before the stream stops, and the live's title
# from [facebook] live_title_template.
enabled = false
watermark_text = "Your logo here"
# top-left, top-right, bottom-left or bottom-right
watermark_corner = "top-right"
outro_text = "Thanks for watching!\nSee you next time"
outro_s = 8
