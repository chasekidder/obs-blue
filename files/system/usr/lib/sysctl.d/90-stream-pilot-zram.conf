# stream-pilot: tuning for an 8 GB single-channel box that swaps to zram.
# Swapping to compressed RAM is far cheaper than dropping page cache, so prefer it.
vm.swappiness = 180
# Read one page at a time from zram (no readahead benefit on a RAM-backed swap).
vm.page-cluster = 0
# Do not boost watermarks after fragmentation events (avoids needless reclaim stalls).
vm.watermark_boost_factor = 0
# Start background reclaim (kswapd) earlier to avoid direct-reclaim stalls mid-stream.
vm.watermark_scale_factor = 125
