# The stream PC is only on for a stream: powered on about 15 minutes before going
# live and off right after. The inherited triggers never fit that: 04:00 (ublue's
# override.conf) is missed and then caught up at boot (Persistent), the base unit's
# OnBootSec=1h lands mid-stream, and daily uptime never accrues. Check once, right
# after boot, while the host is still setting up. Named zz- to sort after override.conf.
[Timer]
OnCalendar=
OnUnitInactiveSec=
OnBootSec=
OnBootSec=2min
RandomizedDelaySec=0
Persistent=false
