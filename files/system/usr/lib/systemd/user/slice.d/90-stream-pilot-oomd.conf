# stream-pilot: never let systemd-oomd kill OBS / Chromium / stream-pilot mid-stream.
# Fedora's systemd-oomd-defaults ships 10-oomd-per-slice-defaults.conf in this directory,
# which sets ManagedOOMMemoryPressure=kill (limit 80%) on every slice of the user manager.
# This drop-in sorts after it (90 > 10) and turns the kill policy back off for user slices.
# System slices keep Fedora's default; the kernel OOM killer remains the last resort.
[Slice]
ManagedOOMMemoryPressure=auto
