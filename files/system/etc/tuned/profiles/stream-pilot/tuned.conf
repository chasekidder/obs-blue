#
# stream-pilot: Plasma's "Performance" power profile (tuned-ppd maps it here, see
# /etc/tuned/ppd.conf). throughput-performance runs the CPU at full speed with the
# performance energy preference and no panel power saving, but it also sets
# vm.swappiness=10, which would undo the zram tuning in
# /usr/lib/sysctl.d/90-stream-pilot-zram.conf (tuned's sysctl wins over /usr/lib).
#

[main]
summary=stream-pilot: throughput-performance, keeping the zram swap tuning
include=throughput-performance

[sysctl]
vm.swappiness=180
vm.page-cluster=0
