[main]
# The default PPD profile. stream-pilot: performance (the stream PC is a mains-powered
# desktop that only runs for streams); Plasma's powerdevilrc also selects it at login.
default=performance
battery_detection=true
sysfs_acpi_monitor=true

[profiles]
# PPD = TuneD
power-saver=powersave
balanced=balanced
performance=stream-pilot

[battery]
# PPD = TuneD
balanced=balanced-battery
